<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Sleep Tracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Last Night's Sleep</ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <h1>{{ latestSleep.summaryString() }}</h1>

      <p>{{ latestSleep.dateString() }}</p>

      <p>
        Bedtime:
        {{ latestSleep.getSleepStart() | date:'shortTime' }}
      </p>

      <p>
        Wake Up:
        {{ latestSleep.getSleepEnd() | date:'shortTime' }}
      </p>

    </ion-card-content>
  </ion-card>

</ion-content>
